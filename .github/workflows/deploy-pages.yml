name: Build and Deploy Pages

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated build to GitHub Pages (main branch only)
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Content — repo Variables (Settings → Secrets and variables → Actions → Variables).
      # Every one is optional; build.js has sensible defaults for all of them.
      SITE_TITLE: ${{ vars.SITE_TITLE }}
      SITE_URL: ${{ vars.SITE_URL }}
      SITE_DESCRIPTION: ${{ vars.SITE_DESCRIPTION }}
      AUTHOR: ${{ vars.AUTHOR }}
      GITHUB_USER: ${{ vars.SITE_GITHUB_USER }}
      GITHUB_URL: ${{ vars.SITE_GITHUB_URL }}
      SPONSOR_URL: ${{ vars.SPONSOR_URL }}
      CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
      HERO_KICKER: ${{ vars.HERO_KICKER }}
      HERO_TAGLINE: ${{ vars.HERO_TAGLINE }}
      HERO_CTA: ${{ vars.HERO_CTA }}
      SUPPORT_HEADING: ${{ vars.SUPPORT_HEADING }}
      SUPPORT_BODY: ${{ vars.SUPPORT_BODY }}
      PROJECTS_JSON: ${{ vars.PROJECTS_JSON }}
      KOFI_URL: ${{ vars.KOFI_URL }}
      PAYPAL_URL: ${{ vars.PAYPAL_URL }}
      HIRE_URL: ${{ vars.HIRE_URL }}
      DISCORD_URL: ${{ vars.DISCORD_URL }}
      DISCORD_APPS_JSON: ${{ vars.DISCORD_APPS_JSON }}
      TWITCH_URL: ${{ vars.TWITCH_URL }}
      CNAME: ${{ vars.CNAME }}
      OUTPUT_DIR: dist

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Check JavaScript syntax
        run: npm run check:syntax

      - name: Build site
        run: npm run build

      - name: Validate generated site
        run: npm run check:output

      - name: Upload the built site
        uses: actions/upload-artifact@v7
        with:
          name: valzargaming-site
          path: dist/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  deploy:
    name: Publish to GitHub Pages
    needs: build
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - name: Download the validated site
        uses: actions/download-artifact@v8
        with:
          name: valzargaming-site
          path: dist

      - name: Publish
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          cname: ${{ vars.CNAME || 'www.valgorithms.com' }}
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
